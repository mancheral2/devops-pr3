name: Mattermost migration

on:
  push:
    branches: [migration]
  workflow_dispatch:

concurrency:
  group: mattermost-migration
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: docker-compose.prod.yml
      DB_MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
      DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check migration flag
        id: status
        run: |
          mkdir -p "$HOME/.mattermost-pr4"
          if [ -f "$HOME/.mattermost-pr4/.migration_completed" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop legacy app and back up MySQL
        if: steps.status.outputs.done == 'false'
        run: |
          docker compose -f legacy/docker-compose.yml stop mattermost
          docker compose -f legacy/docker-compose.yml exec -T mattermost-mysql \
            sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump -u root --single-transaction --no-tablespaces mattermost' \
            > "$HOME/.mattermost-pr4/backup-${{ github.run_id }}-${{ github.run_attempt }}.sql"

      - name: Start PostgreSQL
        if: steps.status.outputs.done == 'false'
        run: docker compose up -d --wait db-postgres

      - name: Migrate data
        if: steps.status.outputs.done == 'false'
        run: |
          docker run --rm --platform linux/amd64 --network mattermost_network \
            mattermost/mattermost-pgloader:latest pgloader \
            --with "include drop" \
            "mysql://root:${DB_MYSQL_ROOT_PASSWORD}@mattermost-mysql/mattermost" \
            "postgresql://postgres:${DB_POSTGRES_PASSWORD}@db-postgres/mattermost"

      - name: Mark successful migration
        if: steps.status.outputs.done == 'false'
        run: touch "$HOME/.mattermost-pr4/.migration_completed"

      - name: Deploy Mattermost 12.0.1
        run: docker compose up -d --remove-orphans

      - name: Check Mattermost API
        run: |
          curl --fail --silent --show-error --retry 60 --retry-delay 5 \
            --retry-all-errors --max-time 5 \
            http://localhost:8065/api/v4/system/ping
