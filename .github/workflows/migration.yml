name: Mattermost migration

on:
  push:
    branches: [migration]
  workflow_dispatch:

concurrency:
  #защита от параллельного запуска
  group: mattermost-migration
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: docker-compose.prod.yml
      DB_MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
      DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
    steps:
      # Получить файлы репозитория на раннер для развертывания.
      - uses: actions/checkout@v4

      # Проверить флаг: завершенную миграцию повторять не нужно (идемпотентность).
      - name: Check migration flag
        id: status
        run: |
          mkdir -p "$HOME/.mattermost-pr4"
          if [ -f "$HOME/.mattermost-pr4/.migration_completed" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      # Остановить запись новых данных и сохранить бэкап MySQL для восстановления.
      - name: Stop legacy app and back up MySQL
        if: steps.status.outputs.done == 'false'
        run: |
          docker compose -f legacy/docker-compose.yml stop mattermost
          docker compose -f legacy/docker-compose.yml exec -T mattermost-mysql \
            sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysqldump -u root --single-transaction --no-tablespaces mattermost' \
            > "$HOME/.mattermost-pr4/backup-${{ github.run_id }}-${{ github.run_attempt }}.sql"

      # Подготовить целевую базу PostgreSQL и дождаться ее готовности.
      - name: Start PostgreSQL
        if: steps.status.outputs.done == 'false'
        run: docker compose up -d --wait db-postgres

      # pgloader: перенести MySQL в PostgreSQL; include drop позволяет повторить перенос.
      # Согласовать схему и типы данных с требованиями Mattermost.
      - name: Migrate data
        if: steps.status.outputs.done == 'false'
        run: |
          docker run --rm --platform linux/amd64 --network mattermost_network \
            mattermost/mattermost-pgloader:latest pgloader --on-error-stop \
            --with "include drop" \
            "mysql://root:${DB_MYSQL_ROOT_PASSWORD}@mattermost-mysql/mattermost" \
            "postgresql://postgres:${DB_POSTGRES_PASSWORD}@db-postgres/mattermost"
          docker compose exec -T db-postgres psql -U postgres -d mattermost \
            -v ON_ERROR_STOP=1 \
            -c 'DROP SCHEMA IF EXISTS public CASCADE; ALTER SCHEMA mattermost RENAME TO public;' \
            -c 'ALTER TYPE channels_type RENAME TO channel_type;
                ALTER TYPE teams_type RENAME TO team_type;
                ALTER TYPE uploadsessions_type RENAME TO upload_session_type;' \
            -c "UPDATE db_migrations SET name='add_createat_to_teamembers'
                WHERE version=92 AND name='add_createat_to_teammembers';"

      # Запустить новый стек; remove-orphans удалит старый контейнер MySQL.
      - name: Deploy Mattermost 12.0.1
        run: docker compose up -d --remove-orphans

      # Smoke-тест: проверить, что API обновленного Mattermost отвечает без ошибки.
      - name: Check Mattermost API
        run: |
          curl --fail --silent --show-error --retry 60 --retry-delay 5 \
            --retry-all-errors --max-time 5 \
            http://localhost:8065/api/v4/system/ping

      # Сохранить флаг успеха, чтобы следующие запуски пропускали бэкап и перенос.
      - name: Mark successful migration
        if: steps.status.outputs.done == 'false'
        run: touch "$HOME/.mattermost-pr4/.migration_completed"
